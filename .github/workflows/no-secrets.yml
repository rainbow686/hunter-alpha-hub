name: no secrets

# A leaked service-role key sat in this public repo for six months (see
# scripts/check-no-secrets.sh). This is the tripwire for the next one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential-shaped strings
        run: bash scripts/check-no-secrets.sh
