name: astro checks

# The Astro app is not deployed from CI yet (Phase 4 owns the cutover), but its
# two guards are the ones that catch silent, expensive mistakes: a colour pair
# that fails contrast, and a title/canonical/structured-data drift against the
# live site. Run them on every change that can affect them.
on:
  pull_request:
    paths:
      - "astro/**"
      - "lib/**"
      - ".github/workflows/astro-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - run: npm ci
      - name: Theme tokens (drift + WCAG AA)
        run: npm run check:theme
      - name: Content proofread guard
        run: npm run check:content
      - name: Build
        run: npm run build
      - name: GA4 probe survives the build
        run: npm run check:analytics
      - name: Internal links survive the build
        run: npm run check:links
      - name: Migration parity vs production
        run: npm run verify:pages
