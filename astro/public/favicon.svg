<!--
  The site mark, at favicon scale (2026-09-18).

  Same subject as the header logo (`src/components/Logo.astro`): the Alpha line —
  two muted nodes are models already revealed, the larger accent node is the
  release that is live now. It is the one asset that was still wearing the retired
  visual language (navy field + violet/teal gradient + magnifying glass) two days
  after the frozen system (ADR-0011) moved the site to ivory paper and a single
  ink-blue accent, which is why it looked like "the old version" in a tab.

  Drawn slightly heavier than the header mark on purpose: a 1.75px line and 3.4px
  nodes read at 32px in a masthead and disappear at 16px in a browser tab.

  Night variant follows the system's night block (warm charcoal, ivory ink, lifted
  accent). Browsers that do not evaluate prefers-color-scheme inside SVG get the
  daylight version, which is the same way the rest of the site degrades.

  Raster companions (`favicon.ico`, `apple-touch-icon.png`) are generated from this
  file by `scripts/generate-favicons.mjs` — edit this file, then run `npm run icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="hunteralphahub">
  <style>
    .paper { fill: #faf6f0; }
    .line { stroke: #1c1a16; }
    .node { fill: #1c1a16; }
    .live { fill: #14507d; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #17130f; }
      .line { stroke: #f4efe4; }
      .node { fill: #f4efe4; }
      .live { fill: #92bcdf; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="7" />
  <line class="line" x1="6" y1="16" x2="25" y2="16" stroke-width="2.6" opacity="0.28" />
  <circle class="node" cx="8.5" cy="16" r="3.9" opacity="0.5" />
  <circle class="node" cx="17" cy="16" r="3.9" opacity="0.5" />
  <circle class="live" cx="25.4" cy="16" r="5.9" />
</svg>
