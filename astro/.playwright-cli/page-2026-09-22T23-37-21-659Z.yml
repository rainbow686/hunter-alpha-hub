        - generic [ref=e66]:
          - heading "What it does" [level=2] [ref=e67]
          - paragraph [ref=e68]: "A browser agent with a dynamic, indexed action space: TypeSafe's Jev picks an operation and an element out of an index built from the live page, and a small LLM writes text only when the operation is TYPE_TEXT. The README's headline result is Zürich to London on Google Flights in 7.1 seconds, with the text generation and the page's loading waits included in that number."
          - paragraph [ref=e69]: "The repository's own description: “Fastest and cheapest web agent”"
        - generic [ref=e70]:
          - heading "How it works" [level=2] [ref=e71]
          - paragraph [ref=e72]: "The repository is a Python package (`jev_ultrafast/`) with `docs/`, `examples/`, `scripts/` and `tests/`, managed by uv. The action space is rebuilt per page rather than fixed, which is what lets Jev choose from an index of elements instead of emitting coordinates."
